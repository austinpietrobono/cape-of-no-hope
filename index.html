<style>
:root{
  color-scheme: dark;
  --void:#050303;
  --bone:#f2e6d2;
  --blood:#7d0208;
  --blood-deep:#4a0105;
  --red:#a8070e;
  --ink:#140203;
  --ember:#ff5a3c;
  --face:"Sinistre", "Palatino Linotype", Georgia, serif;
  --black:"Pirata One", "Sinistre", Georgia, serif;
  --black-sm:"Pirata One", "Sinistre", Georgia, serif;
}
*{box-sizing:border-box}
html,body{height:100%; background:var(--void)}
body{margin:0; color:var(--bone); font-family:var(--face); font-weight:700; overflow:hidden; -webkit-tap-highlight-color:transparent}
button,input{font-family:var(--face); font-weight:700}

.stage{position:fixed; inset:0; display:flex; justify-content:center; background:var(--void)}
.frame{position:relative; width:100%; max-width:480px; height:100%; overflow:hidden; background:var(--void)}

/* ---------- 1. intro video ---------- */
#intro{position:absolute; inset:0}
#intro video{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; background:#000}
.logo-slot{position:absolute; left:50%; top:38%; transform:translate(-50%,-50%); width:84%; text-align:center; pointer-events:none; opacity:0}
.logo-slot img{width:100%; height:auto; display:block}
.logo-text{font-size:clamp(46px,15vw,72px); line-height:.9; letter-spacing:.01em; text-wrap:balance}
#intro .logo-text{color:var(--bone); text-shadow:0 0 18px rgba(0,0,0,.85), 0 0 2px #000}
#intro .logo-slot.in{opacity:1}
#logoDark svg{width:100%; height:auto; display:block; overflow:visible}
#logoDark svg.main{position:relative; filter:drop-shadow(0 0 16px rgba(0,0,0,.75))}
#logoDark svg.glow{position:absolute; inset:0}
#logoDark svg.glow path{fill:#ff3420}
#logoDark .lw{opacity:0}
#logoDark .w-cape{--d:0s} #logoDark .w-of{--d:.55s} #logoDark .w-no{--d:1.1s} #logoDark .w-hope{--d:1.65s}
#logoDark.in .main .lw{animation:wordIn .6s ease-out var(--d) forwards}
#logoDark.in .glow .lw{animation:wordGlow 2s ease-out var(--d) forwards}
@keyframes wordIn{from{opacity:0} to{opacity:1}}
@keyframes wordGlow{0%{opacity:0} 18%{opacity:1} 100%{opacity:0}}
#summon{position:absolute; left:50%; bottom:calc(11% + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); width:min(270px,74%);
  opacity:0; pointer-events:none; backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px)}
#summon b{font-size:48px; letter-spacing:.04em}
#summon:active{transform:translate(-50%,1px)}
#summon.in{opacity:1; pointer-events:auto; transition:opacity 1.2s ease; animation:breathe 2.8s ease-in-out 1.2s infinite}
@keyframes breathe{0%,100%{background-color:rgba(8,0,0,.5)} 50%{background-color:rgba(120,4,10,.62)}}
.field:focus-visible{outline:none}
.ctrls{position:absolute; right:14px; bottom:calc(14px + env(safe-area-inset-bottom,0px)); display:flex; gap:10px; z-index:4}
.icon{width:44px; height:44px; border-radius:50%; display:grid; place-items:center; padding:0; cursor:pointer; color:var(--bone);
  background:rgba(0,0,0,.42); border:1px solid rgba(242,230,210,.35); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
  transition:opacity .4s, background .2s}
.icon svg{width:22px; height:22px}
.icon:hover{background:rgba(0,0,0,.6)}
.icon:focus-visible{outline:2px solid var(--bone); outline-offset:2px}
.icon.gone{opacity:0; pointer-events:none}
#talkSound{position:absolute; right:14px; bottom:calc(14px + env(safe-area-inset-bottom,0px)); z-index:4}
.icon.dark-on-red{color:var(--ink); background:rgba(150,6,12,.6); border-color:rgba(20,2,3,.55)}
.icon.dark-on-red:hover{background:rgba(120,4,10,.75)}
#intro .logo-slot img{filter:drop-shadow(0 0 16px rgba(0,0,0,.75))}
#frame.struck{animation:struck .45s cubic-bezier(.3,.7,.4,1)}
@keyframes struck{0%{transform:none} 15%{transform:translate(-6px,3px) scale(1.01)} 35%{transform:translate(5px,-4px)} 55%{transform:translate(-3px,2px)} 75%{transform:translate(2px,-1px)} 100%{transform:none}}
#vid{transition:filter .5s ease}
#frame.struck #vid,#vid.dim{filter:brightness(.55) saturate(1.5)}
#tapstart[hidden]{display:none}
#tapstart{position:absolute; inset:0; z-index:2; display:grid; place-items:center; background:rgba(0,0,0,.55); border:0; color:var(--bone); font-family:var(--black); font-size:44px; cursor:pointer; text-align:center}
#tapstart small{display:block; font-family:var(--face); font-size:15px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; opacity:.7; margin-top:10px}

/* ---------- 2. blood ---------- */
#blood{position:absolute; inset:0; width:100%; height:100%; pointer-events:none; display:none; z-index:3}

/* ---------- 3. the conversation ---------- */
#frame.red{background:
    radial-gradient(120% 70% at 50% 0%, #c40c14 0%, transparent 60%),
    radial-gradient(140% 90% at 50% 120%, var(--blood-deep) 0%, transparent 60%),
    var(--red)}
#skulls{position:absolute; inset:0; width:100%; height:100%; z-index:1; display:none; pointer-events:none;
  image-rendering:pixelated; image-rendering:crisp-edges; opacity:0; transition:opacity 1.8s ease}
#skulls.on{opacity:1}
#talk{position:absolute; inset:0; z-index:2; display:none; overflow-y:auto; -webkit-overflow-scrolling:touch; background:transparent;
  color:var(--ink)}
#talk::after{content:""; position:fixed; inset:0; pointer-events:none;
  background:radial-gradient(100% 80% at 50% 45%, transparent 55%, rgba(20,0,0,.55) 100%)}
.talk-inner{min-height:100%; display:flex; flex-direction:column; align-items:center; position:relative; z-index:1;
  padding:calc(22px + env(safe-area-inset-top,0px)) 24px calc(84px + env(safe-area-inset-bottom,0px))}
.talk-head{width:118px; flex:none}
.talk-head img{width:100%; height:auto; display:block}
.talk-body{width:100%; max-width:340px; margin-block:auto; padding-block:28px; display:flex; flex-direction:column; align-items:center; gap:22px; text-align:center}
.line{font-family:var(--black); font-size:48px; font-weight:400; line-height:.95; text-wrap:balance; margin:0}
.line.small{font-family:var(--face); font-size:clamp(20px,5.6vw,23px); font-weight:700; line-height:1.38; text-wrap:pretty}
.w{display:inline-block; white-space:nowrap}
.c{display:inline-block; opacity:0; transform:translateY(.25em); filter:blur(6px); animation:ink .55s ease-out forwards}
@keyframes ink{to{opacity:1; transform:none; filter:blur(0)}}
.appear{opacity:0; animation:rise .8s ease-out forwards}
@keyframes rise{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
.rule{width:44px; height:1.5px; background:var(--ink); opacity:.45; flex:none}
.date{font-family:var(--black); font-size:clamp(30px,9vw,40px); font-weight:400; line-height:1.05; margin:0; text-wrap:balance}
.fine{font-family:var(--face); font-size:16px; font-weight:700; letter-spacing:.02em; opacity:.8; margin:4px 0 0}

.field{width:100%; font-size:30px; text-align:center; padding:10px 2px 8px; background:transparent; border:0; border-bottom:1.5px solid var(--ink);
  color:var(--ink); border-radius:0}
.field::placeholder{color:rgba(20,2,3,.38)}
.field:focus{outline:none; border-bottom-color:var(--bone)}

/* card buttons with a folded corner */
.cb{--fill:rgba(150,6,12,.88); --fg:var(--ink); --edge:var(--ink); --fold:14px;
  position:relative; display:flex; flex-direction:column; justify-content:space-between; gap:16px; width:100%; min-height:88px;
  padding:11px 14px 12px 14px; border:1.5px solid var(--edge); border-radius:0; cursor:pointer; text-align:left; text-decoration:none;
  color:var(--fg); background:var(--fill);
  transition:background .2s ease, transform .1s ease; -webkit-tap-highlight-color:transparent}
.cb::before{content:""; position:absolute; left:-1px; top:-1px; width:var(--fold); height:var(--fold);
  background:var(--edge); clip-path:polygon(0 0,100% 0,0 100%)}
.cb small{display:block; white-space:nowrap; padding-left:calc(var(--fold) - 4px); font-family:var(--black-sm); font-size:19px; font-weight:400; letter-spacing:.04em; opacity:.85; line-height:.9}
.cb b{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; font-family:var(--black); font-size:30px; font-weight:400; line-height:.8; letter-spacing:.01em; white-space:nowrap}
.cb b svg{width:20px; height:20px; flex:none; margin-bottom:2px; transition:transform .2s ease}
.cb:hover{--fill:rgba(176,10,18,.92)}
.cb:hover b svg{transform:translateX(3px)}
.cb:active{transform:translateY(1px)}
.cb:focus-visible{outline:2px solid var(--bone); outline-offset:2px}
.cb[disabled]{opacity:.38; cursor:default}
.cb.solid{--fill:rgba(104,3,8,.9); --fg:#f6dccf; --edge:var(--ink)}
.cb.solid:hover{--fill:rgba(84,2,6,.94)}
.cb.big b{font-size:56px}
.cb.big{min-height:112px}
.cb.dark{--fill:rgba(8,0,0,.5); --fg:var(--bone); --edge:rgba(242,230,210,.85)}
.cb.dark:hover{--fill:rgba(60,0,0,.6)}
.pair{display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%}

.post{width:100%; display:flex; flex-direction:column; align-items:center; gap:14px; padding-top:4px}
.post p{margin:0; font-size:19px; line-height:1.35; text-wrap:balance}
.post-frame{width:calc(100% + 28px); max-width:440px; aspect-ratio:1600/1000; display:grid; place-items:center;
  background:rgba(20,2,3,.18); transform:rotate(-1.4deg); box-shadow:0 14px 34px rgba(20,0,0,.45)}
.post-frame img{width:100%; height:100%; display:block; -webkit-touch-callout:default; -webkit-user-select:auto; user-select:auto}
.post-frame .wait{font-size:18px; opacity:.8}
.post-frame img.ghost-out{animation:ghostOut .45s ease-in forwards}
.post-frame img.ghost-in{animation:ghostIn 2.2s cubic-bezier(.2,.6,.3,1) both}
@keyframes ghostOut{to{opacity:0; filter:blur(8px) brightness(1.5); transform:translateY(-6px) scale(1.02)}}
@keyframes ghostIn{
  0%{opacity:0; filter:blur(14px) brightness(1.8) saturate(.2); transform:translateY(10px) scale(.97)}
  30%{opacity:.55; filter:blur(6px) brightness(1.4) saturate(.5)}
  42%{opacity:.25}
  58%{opacity:.8; filter:blur(2px) brightness(1.15)}
  68%{opacity:.6}
  100%{opacity:1; filter:none; transform:none}}
@media (prefers-reduced-motion: reduce){.post-frame img.ghost-in,.post-frame img.ghost-out{animation:none}}
.post .status{font-size:16px; min-height:1.35em; margin:0; opacity:.9}
.titles{display:flex; flex-direction:column; gap:6px; align-items:center}
.titles .line{font-size:36px; line-height:1}
.fields{width:100%; display:flex; flex-direction:column; gap:14px}
.again{font-size:17px; background:none; border:0; color:var(--ink); text-decoration:underline; text-underline-offset:3px; padding:4px 0; cursor:pointer}

@media (prefers-reduced-motion: reduce){
  .c,.appear{animation:none; opacity:1; transform:none; filter:none}
  .logo-slot.in{animation:none; opacity:1}
  #logoDark .lw{animation:none !important; opacity:1}
  #logoDark svg.glow{display:none}
  #summon.in{animation:none}
}
</style>

</head>

        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 5.5v13l8.5-6.5z"/><path d="M12 5.5v13l8.5-6.5z"/><rect x="19.5" y="5.5" width="2" height="13" rx=".6"/></svg>
      </button>
      <button id="sound" class="icon" type="button" aria-label="Turn sound off" aria-pressed="true" title="Sound">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor" stroke="none"/>
          <g id="icoOff" style="display:none"><path d="M16 9.5l5 5M21 9.5l-5 5"/></g>
          <g id="icoOn"><path d="M15.5 9a4.2 4.2 0 0 1 0 6"/><path d="M18 6.5a7.8 7.8 0 0 1 0 11"/></g>
        </svg>

  <canvas id="blood" aria-hidden="true"></canvas>

  <canvas id="skulls" aria-hidden="true"></canvas>
  <button id="talkSound" class="icon dark-on-red" type="button" aria-label="Turn sound off" aria-pressed="true" title="Sound" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor" stroke="none"/>
      <g id="tsOff" style="display:none"><path d="M16 9.5l5 5M21 9.5l-5 5"/></g>
      <g id="tsOn"><path d="M15.5 9a4.2 4.2 0 0 1 0 6"/><path d="M18 6.5a7.8 7.8 0 0 1 0 11"/></g>
    </svg>
  </button>

<script src="assets.js"></script>
<script>
/* ---------- settings ---------- */
const LOGO_DARK = "logo-black-bg.svg";   // white logo, over the intro film
const LOGO_RED  = "logo-red-bg.svg";     // black logo, on the red screens
const LOGO_AT   = 1010 / 30;   // starts at frame 01010, nine frames before 0:00:33:29
const EVENT = "Cape of No Hope";
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const BLOOD_STYLE = "dither";   // "dither" (pixel, like the skull) or "smooth" (glossy liquid)

const $ = id => document.getElementById(id);
const vid = $("vid");
let party = {count:1, names:[], titles:[]};

function logoHTML(src){
  return src ? `<img src="${src}" alt="${EVENT}">` : `<div class="logo-text">Cape of<br>No Hope</div>`;
}


/* ---------- sound: composed live with the Web Audio API ----------
   No audio files. A low drone and wind, a slow minor-key music box over
   organ-like chords, and a distant bell; plus effects for each moment. */
const Sound = (()=>{
  // Everything is composed ahead of time in offline contexts (while the intro plays) and
  // played back as finished audio, so busy animation frames can't make it crackle.
  let ctx = null, master, music, fx, verb, noiseBuf, on = true, started = false;
  const NOTE = m => 440 * Math.pow(2, (m - 69) / 12);
  const SR = 44100;
  const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  let live = null, liveMaster, liveMusic;
  const buffers = {}, waiting = {};
  function offline(sec, compose){
    const oc = new OAC(2, Math.ceil(SR * sec), SR);
    ctx = oc;
    master = oc.createGain(); master.connect(oc.destination);
    verb = oc.createConvolver(); verb.buffer = impulse(3.4, 2.4);
    const wet = oc.createGain(); wet.gain.value = .5; verb.connect(wet); wet.connect(master);
    music = oc.createGain(); music.gain.value = .85; music.connect(master); music.connect(verb);
    fx = oc.createGain(); fx.gain.value = .85; fx.connect(master); fx.connect(verb);
    compose();
    ctx = null;
    return new Promise(res=>{
      oc.oncomplete = e => res(e.renderedBuffer);
      const p = oc.startRendering(); if(p && p.then) p.then(res, ()=>{});
    });
  }
  function initLive(){
    if(live) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return false;
    try{ live = new AC({latencyHint:"playback"}); }catch(e){ try{ live = new AC(); }catch(e2){ return false; } }
    liveMaster = live.createGain(); liveMaster.gain.value = on ? 1 : 0;
    const comp = live.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 3; comp.attack.value = .01; comp.release.value = .3;
    liveMaster.connect(comp); comp.connect(live.destination);
    liveMusic = live.createGain(); liveMusic.gain.value = 0; liveMusic.connect(liveMaster);
    document.addEventListener("visibilitychange", ()=>{ if(live) (document.hidden ? live.suspend() : live.resume()).catch(()=>{}); });
    return true;
  }
  function impulse(sec, decay){
    const len = Math.floor(ctx.sampleRate * sec), b = ctx.createBuffer(2, len, ctx.sampleRate);
    for(let c = 0; c < 2; c++){ const d = b.getChannelData(c); for(let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay); }
    return b;
  }
  function noise(){
    if(!noiseBuf){ noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate); const d = noiseBuf.getChannelData(0); for(let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true; return s;
  }
  function env(g, t, a, peak, d){ g.gain.value = .0001; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(.0001, t + a + d); }
  function tone(type, f, t, a, peak, d, dest = fx, detune = 0){
    const o = ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t); o.detune.value = detune;
    const g = ctx.createGain(); env(g, t, a, peak, d); o.connect(g); g.connect(dest); o.start(t); o.stop(t + a + d + .05); return o;
  }
  function bell(t, base, dest, vol = 1){
    [[1,.12,6],[2,.05,4],[2.76,.05,3.5],[5.4,.03,2],[8.93,.015,1.2]].forEach(([r, p, d])=>tone("sine", base * r, t, .004, p * vol, d, dest));
  }

  // --- the score ---
  const MELODY = [74,77,81,79,77,76,77,74, 72,74,76,77,76,74,73,null, 74,77,81,84,82,81,79,77, 76,77,79,76,74,null,null,null];
  const CHORDS = [[50,53,57],[46,50,53],[43,46,50],[45,49,52]];          // Dm  Bb  Gm  A
  function musicBox(f, t){
    tone("sine", f, t, .004, .07, 1.6, music);
    tone("sine", f * 2, t, .004, .02, .7, music);
    tone("triangle", f * 3.01, t, .003, .01, .3, music);
  }
  function organ(chord, t, dur){
    chord.forEach(m => [-7, 7].forEach(det=>{
      const o = ctx.createOscillator(); o.type = "triangle"; o.frequency.value = NOTE(m + 12); o.detune.value = det;
      const g = ctx.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.022, t + dur * .35); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g); g.connect(music); o.start(t); o.stop(t + dur + .1);
    }));
  }
  function heartbeat(t){
    [[0, .22], [.28, .14]].forEach(([o, v])=>{
      const s = ctx.createOscillator(); s.type = "sine"; s.frequency.setValueAtTime(62, t + o); s.frequency.exponentialRampToValueAtTime(38, t + o + .18);
      const g = ctx.createGain(); env(g, t + o, .01, v, .22); s.connect(g); g.connect(music); s.start(t + o); s.stop(t + o + .3);
    });
  }
  // One 30-second cycle of the score (64 eighth notes), rendered with 3 s extra so the
  // loop point can be crossfaded seamlessly; LFOs are tuned to repeat exactly every cycle.
  const LOOP = 64 * (60 / 64 / 2), XF = 3;
  function composeMusic(){
    const end = LOOP + XF + .1, eighth = 60 / 64 / 2;
    const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 220; lp.Q.value = 4;
    const dg = ctx.createGain(); dg.gain.value = .13; lp.connect(dg); dg.connect(music);
    [[38, 0], [38, 8], [45, -5], [50, 4]].forEach(([m, det])=>{ const o = ctx.createOscillator(); o.type = "sawtooth"; o.frequency.value = NOTE(m); o.detune.value = det; o.connect(lp); o.start(0); o.stop(end); });
    const l1 = ctx.createOscillator(); l1.frequency.value = 2 / LOOP; const l1g = ctx.createGain(); l1g.gain.value = 110; l1.connect(l1g); l1g.connect(lp.frequency); l1.start(0); l1.stop(end);
    const nz = noise(); const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 520; bp.Q.value = 1.3;
    const wg = ctx.createGain(); wg.gain.value = .045; nz.connect(bp); bp.connect(wg); wg.connect(music); nz.start(0); nz.stop(end);
    const l2 = ctx.createOscillator(); l2.frequency.value = 3 / LOOP; const l2g = ctx.createGain(); l2g.gain.value = 360; l2.connect(l2g); l2g.connect(bp.frequency); l2.start(0); l2.stop(end);
    for(let step = 0; step * eighth < LOOP + XF; step++){
      const t = step * eighth, m = MELODY[step % MELODY.length];
      if(m) musicBox(NOTE(m), t);
      if(step % 16 === 0) organ(CHORDS[Math.floor(step / 16) % 4], t, eighth * 16);
      if(step % 8 === 4 && Math.floor(step / 32) % 2 === 1) heartbeat(t);
      if(step % 64 === 40) bell(t, NOTE(38), music, .9);
    }
  }
  function makeLoop(buf){
    const n = Math.round(LOOP * SR), x = Math.round(XF * SR);
    const out = new OAC(2, n, SR).createBuffer(2, n, SR);
    for(let c = 0; c < 2; c++){
      const s = buf.getChannelData(c), d = out.getChannelData(c);
      for(let i = 0; i < n; i++){
        if(i < x){ const a = i / x; d[i] = s[i] * Math.sqrt(a) + s[n + i] * Math.sqrt(1 - a); }
        else d[i] = s[i];
      }
    }
    return out;
  }
  function startMusic(){
    if(!live || started) return; started = true;
    const go = buf=>{
      const src = live.createBufferSource(); src.buffer = buf; src.loop = true; src.connect(liveMusic);
      const t = live.currentTime + .05;
      liveMusic.gain.cancelScheduledValues(t); liveMusic.gain.setValueAtTime(0, t); liveMusic.gain.linearRampToValueAtTime(1, t + 5);
      src.start(t);
    };
    if(buffers.music) go(buffers.music); else (waiting.music = waiting.music || []).push(go);
  }

  // A deep, demonic laugh made from a buzzing voice through vowel filters:
  // a long "Mwah", then a run of "ha"s that fall in pitch and fade.
  function laugh(t0){
    const out = ctx.createGain(); out.gain.value = .9;
    const shaper = ctx.createWaveShaper(); const curve = new Float32Array(1024);
    for(let i = 0; i < 1024; i++){ const x = i / 511.5 - 1; curve[i] = Math.tanh(x * 2.2); }
    shaper.curve = curve; shaper.connect(out); out.connect(fx);
    const formants = [[700, 7, 1], [1150, 9, .55], [2500, 12, .28]];
    const sylls = [{d:.46, p:120, mwa:true, v:1}];
    for(let i = 0; i < 7; i++) sylls.push({d:.15 + Math.random() * .02, p:132 - i * 7 + Math.random() * 6, v:1 - i * .08});
    sylls.push({d:.62, p:84, v:.75, tail:true});
    let t = t0;
    sylls.forEach((s, i)=>{
      const voice = ctx.createGain(); voice.gain.value = .0001;
      const bank = ctx.createGain(); bank.gain.value = 1;
      formants.forEach(([f, q, g])=>{
        const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = f; bp.Q.value = q;
        if(s.mwa){ bp.frequency.setValueAtTime(f * .35, t); bp.frequency.exponentialRampToValueAtTime(f, t + .12); }   // lips opening: "mw-ah"
        const fg = ctx.createGain(); fg.gain.value = g; voice.connect(bp); bp.connect(fg); fg.connect(bank);
      });
      bank.connect(shaper);
      // the voice: a low buzz with an octave-down growl and a little wobble
      [[1, .8], [.5, .55]].forEach(([mul, amp])=>{
        const o = ctx.createOscillator(); o.type = "sawtooth";
        o.frequency.setValueAtTime(s.p * mul, t); o.frequency.linearRampToValueAtTime(s.p * mul * (s.tail ? .72 : .9), t + s.d);
        const vib = ctx.createOscillator(); vib.frequency.value = 5.5; const va = ctx.createGain(); va.gain.value = s.p * mul * .02; vib.connect(va); va.connect(o.frequency);
        const og = ctx.createGain(); og.gain.value = amp; o.connect(og); og.connect(voice);
        o.start(t); o.stop(t + s.d + .05); vib.start(t); vib.stop(t + s.d + .05);
      });
      const a = s.mwa ? .1 : .025, peak = .5 * s.v;
      voice.gain.setValueAtTime(.0001, t); voice.gain.exponentialRampToValueAtTime(peak, t + a);
      voice.gain.setValueAtTime(peak, t + s.d * .55); voice.gain.exponentialRampToValueAtTime(.0001, t + s.d);
      // the breathy "h" at the start of each ha
      if(!s.mwa){
        const hn = noise(), hb = ctx.createBiquadFilter(); hb.type = "bandpass"; hb.frequency.value = 1600; hb.Q.value = 1.2;
        const hg = ctx.createGain(); env(hg, t - .03, .01, .14 * s.v, .05); hn.connect(hb); hb.connect(hg); hg.connect(out); hn.start(t - .03); hn.stop(t + .08);
      }
      t += s.d + (s.mwa ? .1 : .06);
    });
  }

  // --- effects ---
  const fxs = {
    summon(){
      const t = ctx.currentTime;
      const o = ctx.createOscillator(); o.type = "sine"; o.frequency.setValueAtTime(72, t); o.frequency.exponentialRampToValueAtTime(26, t + 2.4);
      const g = ctx.createGain(); env(g, t, .02, .9, 2.6); o.connect(g); g.connect(fx); o.start(t); o.stop(t + 2.8);
      const nz = noise(); const f = ctx.createBiquadFilter(); f.type = "lowpass";
      f.frequency.setValueAtTime(180, t); f.frequency.exponentialRampToValueAtTime(2600, t + .25); f.frequency.exponentialRampToValueAtTime(140, t + 2.2);
      const ng = ctx.createGain(); env(ng, t, .06, .3, 2); nz.connect(f); f.connect(ng); ng.connect(fx); nz.start(t); nz.stop(t + 2.3);
      bell(t + .05, NOTE(33), fx, 1.2);
    },
    pour(){
      const t = ctx.currentTime;
      // a deep swell underneath everything
      const sub = ctx.createOscillator(); sub.type = "sine"; sub.frequency.setValueAtTime(46, t); sub.frequency.linearRampToValueAtTime(34, t + 3.6);
      const sg = ctx.createGain(); sg.gain.setValueAtTime(.0001, t); sg.gain.exponentialRampToValueAtTime(.55, t + 3.2); sg.gain.exponentialRampToValueAtTime(.0001, t + 5);
      sub.connect(sg); sg.connect(fx); sub.start(t); sub.stop(t + 5.1);
      // the thick pour: dark noise that pulses like something heavy being poured
      const nz = noise(), lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.Q.value = 6;
      lp.frequency.setValueAtTime(160, t); lp.frequency.exponentialRampToValueAtTime(620, t + 3.4);
      const pulse = ctx.createGain(); pulse.gain.value = .55;
      const lfo = ctx.createOscillator(); lfo.type = "sine"; lfo.frequency.setValueAtTime(5, t); lfo.frequency.linearRampToValueAtTime(9, t + 3.4);
      const lfoAmt = ctx.createGain(); lfoAmt.gain.value = .45; lfo.connect(lfoAmt); lfoAmt.connect(pulse.gain);
      const pg = ctx.createGain(); pg.gain.setValueAtTime(.0001, t); pg.gain.exponentialRampToValueAtTime(.32, t + 2.8); pg.gain.exponentialRampToValueAtTime(.0001, t + 4.6);
      nz.connect(lp); lp.connect(pulse); pulse.connect(pg); pg.connect(fx); nz.start(t); nz.stop(t + 4.7); lfo.start(t); lfo.stop(t + 4.7);
      // wet splats as the heavier drops land
      for(let i = 0; i < 11; i++){
        const s = t + .35 + Math.random() * 3;
        const sn = noise(), sf = ctx.createBiquadFilter(); sf.type = "lowpass"; sf.frequency.setValueAtTime(1400, s); sf.frequency.exponentialRampToValueAtTime(260, s + .09);
        const sgn = ctx.createGain(); env(sgn, s, .002, .16, .1); sn.connect(sf); sf.connect(sgn); sgn.connect(fx); sn.start(s); sn.stop(s + .14);
        const th = ctx.createOscillator(); th.type = "sine"; th.frequency.setValueAtTime(140, s); th.frequency.exponentialRampToValueAtTime(55, s + .1);
        const tg = ctx.createGain(); env(tg, s, .002, .18, .12); th.connect(tg); tg.connect(fx); th.start(s); th.stop(s + .16);
      }
      // dissonant strings, creeping up with a tremble
      const strings = ctx.createBiquadFilter(); strings.type = "lowpass"; strings.frequency.setValueAtTime(500, t); strings.frequency.exponentialRampToValueAtTime(1800, t + 3.2);
      const trem = ctx.createGain(); trem.gain.value = .7;
      const tl = ctx.createOscillator(); tl.frequency.value = 7.5; const tla = ctx.createGain(); tla.gain.value = .3; tl.connect(tla); tla.connect(trem.gain);
      const stg = ctx.createGain(); stg.gain.setValueAtTime(.0001, t); stg.gain.exponentialRampToValueAtTime(.09, t + 3.1); stg.gain.exponentialRampToValueAtTime(.0001, t + 5.2);
      strings.connect(trem); trem.connect(stg); stg.connect(fx); tl.start(t); tl.stop(t + 5.3);
      [50, 51, 57, 58, 62, 63].forEach((m, i)=>{
        const o = ctx.createOscillator(); o.type = "sawtooth"; o.frequency.setValueAtTime(NOTE(m), t); o.frequency.linearRampToValueAtTime(NOTE(m) * 1.06, t + 3.4);
        o.detune.value = (i % 2 ? 6 : -6); o.connect(strings); o.start(t); o.stop(t + 5.3);
      });
      laugh(t + 2.5);
    },
    whisper(){
      const t = ctx.currentTime, nz = noise(); const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 6;
      bp.frequency.setValueAtTime(2200, t); bp.frequency.exponentialRampToValueAtTime(3400, t + .7);
      const g = ctx.createGain(); env(g, t, .25, .05, .6); nz.connect(bp); bp.connect(g); g.connect(fx); nz.start(t); nz.stop(t + 1);
    },
    breath(){                                   // a slow, ragged inhale and a long exhale
      const t = ctx.currentTime;
      const draw = (start, f0, f1, a, peak, d, q)=>{
        const nz = noise(), bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = q;
        bp.frequency.setValueAtTime(f0, start); bp.frequency.exponentialRampToValueAtTime(f1, start + a + d);
        const g = ctx.createGain(); env(g, start, a, peak, d);
        const shake = ctx.createGain(); shake.gain.value = 1;
        const lfo = ctx.createOscillator(); lfo.frequency.value = 6.5; const lg = ctx.createGain(); lg.gain.value = .35;
        lfo.connect(lg); lg.connect(shake.gain);
        nz.connect(bp); bp.connect(g); g.connect(shake); shake.connect(fx);
        nz.start(start); nz.stop(start + a + d + .1); lfo.start(start); lfo.stop(start + a + d + .1);
      };
      draw(t, 700, 1600, 1.0, .5, .35, 2.2);          // in
      draw(t + 1.45, 1500, 480, .18, .6, 1.7, 1.6);   // out
      tone("sine", 55, t + 1.3, .6, .05, 1.8, fx);    // something low in the room
    },
    tap(){
      const t = ctx.currentTime;
      const o = ctx.createOscillator(); o.type = "sine"; o.frequency.setValueAtTime(190, t); o.frequency.exponentialRampToValueAtTime(90, t + .12);
      const g = ctx.createGain(); env(g, t, .002, .3, .16); o.connect(g); g.connect(fx); o.start(t); o.stop(t + .2);
      const nz = noise(); const hp = ctx.createBiquadFilter(); hp.type = "bandpass"; hp.frequency.value = 1800; hp.Q.value = 2;
      const ng = ctx.createGain(); env(ng, t, .001, .12, .04); nz.connect(hp); hp.connect(ng); ng.connect(fx); nz.start(t); nz.stop(t + .08);
    },
    yes(){                                      // a ghostly choir and a bell
      const t = ctx.currentTime;
      [50, 57, 62, 66, 69].forEach((m, i)=>[-9, 9].forEach(det=>{
        const o = ctx.createOscillator(); o.type = "sawtooth"; o.frequency.value = NOTE(m); o.detune.value = det;
        const f = ctx.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 750 + i * 60; f.Q.value = 3.5;
        const g = ctx.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.05, t + 1.4); g.gain.exponentialRampToValueAtTime(.0001, t + 5.5);
        o.connect(f); f.connect(g); g.connect(fx); o.start(t); o.stop(t + 5.6);
      }));
      bell(t + .1, NOTE(50), fx, 1.1);
    },
    no(){                                       // the guillotine
      const t = ctx.currentTime, nz = noise();
      const hp = ctx.createBiquadFilter(); hp.type = "bandpass"; hp.Q.value = 8;
      hp.frequency.setValueAtTime(7000, t); hp.frequency.exponentialRampToValueAtTime(1600, t + .5);
      const g = ctx.createGain(); env(g, t, .02, .22, .5); nz.connect(hp); hp.connect(g); g.connect(fx); nz.start(t); nz.stop(t + .6);
      const o = ctx.createOscillator(); o.type = "sine"; o.frequency.setValueAtTime(110, t + .55); o.frequency.exponentialRampToValueAtTime(35, t + .9);
      const og = ctx.createGain(); env(og, t + .55, .005, .9, .5); o.connect(og); og.connect(fx); o.start(t + .55); o.stop(t + 1.2);
      [38, 39, 45].forEach(m => tone("sawtooth", NOTE(m), t + .6, .3, .05, 2.6, fx));
    }
  };

  const LENGTHS = {summon:4.6, tap:1.2, pour:8.6, whisper:2.6, breath:4.2, no:5.6, yes:8.4};
  async function renderAll(){
    if(!OAC) return;
    for(const name of ["summon", "tap", "pour", "whisper", "breath", "no", "yes"]){
      try{ buffers[name] = await offline(LENGTHS[name], ()=>fxs[name]()); }catch(e){}
      (waiting[name] || []).forEach(f=>f(buffers[name])); waiting[name] = [];
    }
    try{ buffers.music = makeLoop(await offline(LOOP + XF, composeMusic)); }catch(e){}
    (waiting.music || []).forEach(f=>f(buffers.music)); waiting.music = [];
  }
  function playBuf(buf){

  }

    prepare(){ setTimeout(renderAll, 1200); },
    unlock(){ if(initLive()) live.resume().catch(()=>{}); },
    play(name){

/* Blood, built as a height field: drips and a flood are painted as soft shapes,
   blurred so they merge like liquid, then lit as a wet surface. Thin film reads
   bright crimson, deep pools go near-black, slow ripples drift down the flood,
   and a light above-left puts sharp highlights on every bead and run. */
function pour(done){
  const cv = $("blood"), fr = $("frame");
  const W = fr.clientWidth, H = fr.clientHeight;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  cv.style.transition = ""; cv.style.opacity = "1"; cv.style.display = "block";
  const out = cv.getContext("2d");
  const U = 3;                                   // motion is worked out in 3px units
  const S = 2;                                   // css px per pixel of the blood grid
  const lw = W / U, lh = H / U;
  const sw = Math.ceil(W / S), sh = Math.ceil(H / S), N = sw * sh;
  const sim = document.createElement("canvas"); sim.width = sw; sim.height = sh;
  const sg = sim.getContext("2d", {willReadFrequently:true});
  const lit = document.createElement("canvas"); lit.width = sw; lit.height = sh;
  const lg = lit.getContext("2d");
  const img = lg.createImageData(sw, sh), px = img.data;
  const A = new Float32Array(N), B = new Float32Array(N), Ht = new Float32Array(N);

  function blur(src, dst, r, w, hh){                // separable box blur; twice \u2248 gaussian
    const inv = 1 / (2 * r + 1);
    for(let y = 0; y < hh; y++){
      const o = y * w; let s = 0;
      for(let x = -r; x <= r; x++) s += src[o + Math.min(w - 1, Math.max(0, x))];
      for(let x = 0; x < w; x++){
        dst[o + x] = s * inv;
        s += src[o + Math.min(w - 1, x + r + 1)] - src[o + Math.max(0, x - r)];
      }
    }
    for(let x = 0; x < w; x++){
      let s = 0;
      for(let y = -r; y <= r; y++) s += dst[Math.min(hh - 1, Math.max(0, y)) * w + x];
      for(let y = 0; y < hh; y++){
        src[y * w + x] = s * inv;
        s += dst[Math.min(hh - 1, y + r + 1) * w + x] - dst[Math.max(0, y - r) * w + x];
      }
    }
  }
  const sm = (a, b, x)=>{ const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

  // slow ripples for the surface of the flood: soft noise, scrolled downward with the flow
  const RH = sh * 2, R = new Float32Array(sw * RH), RB = new Float32Array(sw * RH);
  for(let i = 0; i < R.length; i++) R[i] = Math.random();
  function blurWrap(src, dst, r, w, hh){          // same blur, but wrapping so the texture tiles seamlessly
    const inv = 1 / (2 * r + 1);
    for(let y = 0; y < hh; y++){ const o = y * w;
      for(let x = 0; x < w; x++){ let s = 0; for(let d = -r; d <= r; d++) s += src[o + ((x + d) % w + w) % w]; dst[o + x] = s * inv; } }
    for(let x = 0; x < w; x++){
      for(let y = 0; y < hh; y++){ let s = 0; for(let d = -r; d <= r; d++) s += dst[(((y + d) % hh + hh) % hh) * w + x]; src[y * w + x] = s * inv; } }
  }
  blurWrap(R, RB, 5, sw, RH); blurWrap(R, RB, 5, sw, RH); blurWrap(R, RB, 4, sw, RH);
  let rmin = 1, rmax = 0; for(const v of R){ if(v < rmin) rmin = v; if(v > rmax) rmax = v; }
  for(let i = 0; i < R.length; i++) R[i] = (R[i] - rmin) / (rmax - rmin) - .5;

  const n = Math.max(9, Math.round(lw / 8));
  const drips = Array.from({length:n}, (_, i)=>{
    const big = Math.random() < .3;
    return {
      x: (i + .5 + (Math.random() - .5) * .8) * lw / n,
      y: 4 + Math.random() * 6, big,
      v: big ? 8 : 25 + Math.random() * 40,
      r: big ? 3.4 + Math.random() * 1.6 : 1.7 + Math.random() * 1.5,
      w: big ? 2 + Math.random() * .9 : .9 + Math.random() * .8,
      delay: big ? Math.random() * .2 : .05 + Math.random() * .6,
      stall: 0, sway: Math.random() * 6.28
    };
  });
  const drops = [];
  const bumps = Array.from({length: Math.ceil(lw / 5) + 2}, ()=>Math.random());
  const FULL = 3.6;                              // seconds until the screen is covered
  const k = (lh + 24) / Math.pow(FULL - 1.3, 2.4);
  // light from above-left, viewer straight on
  const Lx = -.33, Ly = -.62, Lz = .71;
  const hl = Math.hypot(Lx, Ly, Lz + 1), Hx = Lx / hl, Hy = Ly / hl, Hz = (Lz + 1) / hl;
  let t0 = null, last = null, finished = false;

  function step(now){
    if(t0 === null){ t0 = now; last = now; }
    const t = (now - t0) / 1000, dt = Math.min(1 / 30, (now - last) / 1000); last = now;

    // the flood: a heavy lip creeps first, then gives way and pours
    const lip = 4 + 4 * t + k * Math.pow(Math.max(0, t - 1.3), 2.4);

    for(const d of drips){
      if(t < d.delay) continue;
      if(d.stall > 0){ d.stall -= dt; d.r = Math.min(d.big ? 6.5 : 4.5, d.r + dt * 2.4); }   // catches, swells
      else{
        d.v = Math.min(d.big ? 340 : 260, d.v + (d.big ? 150 : 95) * dt + d.r * 10 * dt);
        d.y += d.v * dt;
        if(Math.random() < dt * (d.big ? .35 : .7)){ d.stall = .05 + Math.random() * .2; d.v *= .45; }
      }
      if(d.y > 26 && Math.random() < dt * (d.big ? 1 : .5)){ drops.push({x: d.x + (Math.random() - .5) * .6, y: d.y + d.r, v: d.v + 50, r: d.r * (.35 + Math.random() * .25)}); d.r *= .92; }
      if(d.y < lip + 4) d.y = lip + 4;
    }
    for(const p of drops){ p.v += 260 * dt; p.y += p.v * dt; }

    sg.setTransform(1, 0, 0, 1, 0, 0);
    sg.clearRect(0, 0, sw, sh);
    sg.setTransform(U / S, 0, 0, U / S, 0, 0);
    sg.fillStyle = "#fff"; sg.strokeStyle = "#fff"; sg.lineCap = "round";
    sg.fillRect(0, 0, lw + 2, lip);
    for(let i = 0; i < bumps.length; i++){                  // scalloped, heavy leading edge
      const r = 2.4 + bumps[i] * 4.4 + Math.sin(t * 2.4 + i * 1.7) * .8;
      sg.beginPath(); sg.arc(i * 5, lip + bumps[i] * 1.5, r, 0, 6.283); sg.fill();
    }
    for(const d of drips){
      if(t < d.delay) continue;
      const sway = Math.sin(t * 1.4 + d.sway) * .5;
      const mid = lip + (d.y - lip) * .45;
      sg.lineWidth = d.w * 2.6;                              // wide where it leaves the flood
      sg.beginPath(); sg.moveTo(d.x + sway, lip - 2); sg.lineTo(d.x + sway * .5, mid); sg.stroke();
      sg.lineWidth = d.w * 1.8;                              // thinning run
      sg.beginPath(); sg.moveTo(d.x + sway * .5, mid); sg.lineTo(d.x, d.y); sg.stroke();
      sg.lineWidth = d.w * 3.2;                              // neck swells into the bead
      sg.beginPath(); sg.moveTo(d.x, d.y - d.r * 2.4); sg.lineTo(d.x, d.y); sg.stroke();
      sg.beginPath(); sg.arc(d.x, d.y, d.r, 0, 6.283); sg.fill();
    }
    for(const p of drops){ if(p.y < lh + 10){ sg.beginPath(); sg.ellipse(p.x, p.y, p.r * .85, p.r * 1.25, 0, 0, 6.283); sg.fill(); } }

    const src = sg.getImageData(0, 0, sw, sh).data;
    for(let i = 0; i < N; i++) A[i] = src[i * 4 + 3] / 255;
    blur(A, B, 3, sw, sh); blur(A, B, 2, sw, sh);

    // surface height: the merged shape plus slow ripples where the blood is deep
    const off = Math.floor(t * 38) % RH;
    for(let y = 0; y < sh; y++){
      const ry = ((y - off) % RH + RH) % RH * sw, o = y * sw;
      for(let x = 0; x < sw; x++){
        const f = A[o + x];
        Ht[o + x] = f + R[ry + x] * .11 * sm(.55, .95, f);
      }
    }

    for(let y = 0; y < sh; y++){
      for(let x = 0; x < sw; x++){
        const i = y * sw + x, f = A[i], o = i * 4;
        if(f < .3){ px[o + 3] = 0; continue; }
        const ax = A[i + (x < sw - 1 ? 1 : 0)] - A[i - (x > 0 ? 1 : 0)];
        const ay = A[i + (y < sh - 1 ? sw : 0)] - A[i - (y > 0 ? sw : 0)];
        const glen = Math.sqrt(ax * ax + ay * ay) * .5 + 1e-4;
        const cover = Math.min(1, Math.max(0, (f - .45) / glen * 1.5 + .5));   // anti-aliased edge
        if(cover <= 0){ px[o + 3] = 0; continue; }
        // surface normal from the height field
        const gx = Ht[i + (x < sw - 1 ? 1 : 0)] - Ht[i - (x > 0 ? 1 : 0)];
        const gy = Ht[i + (y < sh - 1 ? sw : 0)] - Ht[i - (y > 0 ? sw : 0)];
        let nx = -gx * 7, ny = -gy * 7, nz = 1;
        const nl = 1 / Math.sqrt(nx * nx + ny * ny + 1); nx *= nl; ny *= nl; nz *= nl;
        const diff = Math.max(0, nx * Lx + ny * Ly + nz * Lz);
        const nh = Math.max(0, nx * Hx + ny * Hy + nz * Hz);
        let s = nh * nh; s *= s; s *= s; s *= s; s *= s; s *= s;       // \u2248 nh^64: tight wet glint
        const sheen = Math.pow(nh, 10) * .22;
        // thin film lets light through (crimson); deep blood absorbs it (near-black)
        const th = sm(.42, .98, f);
        const cr = 176 - 118 * th, cg = 10 - 9 * th, cb = 20 - 15 * th;
        const shade = .42 + .7 * diff;
        const rim = 1 - .35 * (1 - sm(.46, .66, f));
        px[o]     = Math.min(255, cr * shade * rim + 255 * s + 150 * sheen);
        px[o + 1] = Math.min(255, cg * shade * rim + 225 * s + 40 * sheen);
        px[o + 2] = Math.min(255, cb * shade * rim + 220 * s + 45 * sheen);
        px[o + 3] = 255 * cover;
      }
    }
    lg.putImageData(img, 0, 0);
    out.clearRect(0, 0, cv.width, cv.height);
    out.imageSmoothingEnabled = true; out.imageSmoothingQuality = "high";
    out.drawImage(lit, 0, 0, cv.width, cv.height);
    // the pooled top sits in shadow
    out.globalCompositeOperation = "source-atop";
    const g = out.createLinearGradient(0, 0, 0, cv.height);
    g.addColorStop(0, "rgba(18,0,2,.5)"); g.addColorStop(.3, "rgba(18,0,2,.1)"); g.addColorStop(1, "rgba(18,0,2,0)");
    out.fillStyle = g; out.fillRect(0, 0, cv.width, cv.height);
    out.globalCompositeOperation = "source-over";

    if(lip < lh + 6 && t < FULL + 1.5) return requestAnimationFrame(step);
    if(finished) return; finished = true;
    done();                                               // the red room is ready beneath
    $("frame").classList.remove("struck");
    requestAnimationFrame(()=>{ cv.style.transition = "opacity 1s ease"; cv.style.opacity = "0"; });
    setTimeout(()=>{ cv.style.display = "none"; }, 1050);
  }
  requestAnimationFrame(step);
}


/* The same pour, drawn like the skull: chunky pixels in four tones
   (deep, blood, bright, bone glint), dithered so the shading becomes dot texture. */
function pourDither(done){
  const cv = $("blood"), fr = $("frame");
  const W = fr.clientWidth, H = fr.clientHeight;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);

  const lit = document.createElement("canvas"); lit.width = sw; lit.height = sh;

  const A = new Float32Array(N), B = new Float32Array(N), V = new Float32Array(N);
  const PAL = [[34,0,4],[112,4,9],[196,16,24],[255,214,196]];   // deep, blood, bright, bone glint

    const inv = 1 / (2 * r + 1);

      for(let x = -r; x <= r; x++) s += src[o + Math.min(sw - 1, Math.max(0, x))];
      for(let x = 0; x < sw; x++){ dst[o + x] = s * inv; s += src[o + Math.min(sw - 1, x + r + 1)] - src[o + Math.max(0, x - r)]; } }
    for(let x = 0; x < sw; x++){ let s = 0;
      for(let y = -r; y <= r; y++) s += dst[Math.min(sh - 1, Math.max(0, y)) * sw + x];
      for(let y = 0; y < sh; y++){ src[y * sw + x] = s * inv; s += dst[Math.min(sh - 1, y + r + 1) * sw + x] - dst[Math.max(0, y - r) * sw + x]; } }
  }
  const sm = (a, b, x)=>{ const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

  const n = Math.max(9, Math.round(lw / 8));
  const drips = Array.from({length:n}, (_, i)=>{
    const big = Math.random() < .3;
    return { x: (i + .5 + (Math.random() - .5) * .8) * lw / n, y: 4 + Math.random() * 6, big,
      v: big ? 8 : 25 + Math.random() * 40, r: big ? 3.6 + Math.random() * 1.6 : 2.2 + Math.random() * 1.4,
      w: big ? 1.7 + Math.random() * .7 : 1 + Math.random() * .5,
      delay: big ? Math.random() * .2 : .05 + Math.random() * .6, stall: 0, sway: Math.random() * 6.28 };
  });
  const drops = [];
  const bumps = Array.from({length: Math.ceil(lw / 5) + 2}, ()=>Math.random());
  const FULL = 3.6, k = (lh + 24) / Math.pow(FULL - 1.3, 2.4);
  const Lx = -.33, Ly = -.62, Lz = .71;

  function step(now){

    const lip = 4 + 4 * t + k * Math.pow(Math.max(0, t - 1.3), 2.4);
    for(const d of drips){

      else{
        d.v = Math.min(d.big ? 340 : 260, d.v + (d.big ? 150 : 95) * dt + d.r * 10 * dt);
        d.y += d.v * dt;
        if(Math.random() < dt * (d.big ? .35 : .7)){ d.stall = .05 + Math.random() * .2; d.v *= .45; }
      }
      if(d.y > 26 && Math.random() < dt * (d.big ? 1 : .5)){ drops.push({x: d.x, y: d.y + d.r, v: d.v + 50, r: Math.max(1.4, d.r * (.4 + Math.random() * .25))}); d.r *= .92; }

      for(const p of drops){ if(p.y < lh + 10){ sg.beginPath(); sg.ellipse(p.x, p.y, p.r * .9, p.r * 1.3, 0, 0, 6.283); sg.fill(); } }

      const src = sg.getImageData(0, 0, sw, sh).data;
      for(let i = 0; i < N; i++) A[i] = src[i * 4 + 3] / 255;
      blur(A, B, 1); blur(A, B, 1);

      // tone of each pixel: lit like the glossy version, then dithered to four colours

          let nx = -gx * 4, ny = -gy * 4; const nl = 1 / Math.sqrt(nx * nx + ny * ny + 1); nx *= nl; ny *= nl; const nz = nl;

          let s = nh * nh; s *= s; s *= s; s *= s; s *= s;           // \u2248 nh^32
          const th = sm(.5, .98, f);
          V[i] = ((.2 + .55 * (1 - th)) * (.45 + .7 * diff) * shadow + s * 1.1) * 3;   // 0..3 across the palette
        }
      }
      // Atkinson dither across the four tones
      for(let y = 0; y < sh; y++){
        for(let x = 0; x < sw; x++){
          const i = y * sw + x, o = i * 4, v = V[i];
          if(v < 0){ px[o + 3] = 0; continue; }
          const q = Math.max(0, Math.min(3, Math.round(v))), err = (v - q) / 8;
          const c = PAL[q]; px[o] = c[0]; px[o + 1] = c[1]; px[o + 2] = c[2]; px[o + 3] = 255;
          if(x + 1 < sw && V[i + 1] >= 0) V[i + 1] += err;
          if(x + 2 < sw && V[i + 2] >= 0) V[i + 2] += err;
          if(y + 1 < sh){ if(x > 0 && V[i + sw - 1] >= 0) V[i + sw - 1] += err; if(V[i + sw] >= 0) V[i + sw] += err; if(x + 1 < sw && V[i + sw + 1] >= 0) V[i + sw + 1] += err; }
          if(y + 2 < sh && V[i + 2 * sw] >= 0) V[i + 2 * sw] += err;
        }
      }
      lg.putImageData(img, 0, 0);
      out.clearRect(0, 0, cv.width, cv.height);
      out.imageSmoothingEnabled = false;
      out.drawImage(lit, 0, 0, sw * S * dpr, sh * S * dpr);
    }

    if(lip < lh + 6 && t < FULL + 1.5) return requestAnimationFrame(step);
    if(finished) return; finished = true;
    done();
    $("frame").classList.remove("struck");
    // dissolve away in coarse steps, like a dither fading out
    let a = 1;
    const fade = setInterval(()=>{ a -= .2; cv.style.opacity = String(Math.max(0, a)); if(a <= 0){ clearInterval(fade); cv.style.display = "none"; cv.style.imageRendering = ""; } }, 110);
  }
  requestAnimationFrame(step);
}

function inkText(text, cls = "line", startDelay = 0){
  // returns {el, ms}: letters bleed in one by one, words never break mid-way
  const p = document.createElement("p"); p.className = cls;
  let k = 0;
  text.split(" ").forEach((word, wi, arr)=>{
    const w = document.createElement("span"); w.className = "w";
    for(const ch of word){
      const c = document.createElement("span"); c.className = "c"; c.textContent = ch;
      c.style.animationDelay = (startDelay + k * 32) + "ms"; k++;
      w.appendChild(c);
    }
    p.appendChild(w);
    if(wi < arr.length - 1){ p.appendChild(document.createTextNode(" ")); k++; }
  });
  p.setAttribute("aria-label", text);
  if(cls === "line") setTimeout(()=>Sound.play("whisper"), REDUCED ? 0 : startDelay);
  return {el: p, ms: REDUCED ? 0 : startDelay + k * 32 + 550};
}
function appear(el, delay){ el.classList.add("appear"); el.style.animationDelay = (REDUCED ? 0 : delay) + "ms"; return el; }
function clear(){
  const t = $("talkInner"); t.innerHTML = ""; $("talk").scrollTop = 0;

  const body = h("div", {className:"talk-body"}); t.appendChild(body);
  return body;
}
function h(tag, attrs = {}, text){ const e = document.createElement(tag); Object.assign(e, attrs); if(text !== undefined) e.textContent = text; return e; }
const ARROW = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 10h13M11 5l5 5-5 5"/></svg>';
function card({tag = "button", caption, label, cls = "", href, arrow = true}){
  const e = document.createElement(tag);
  e.className = "cb " + cls;
  if(tag === "button") e.type = "button";
  if(href){ e.href = href; }
  const s = h("small", {}, caption);
  const b = h("b"); b.appendChild(document.createTextNode(label));
  if(arrow) b.insertAdjacentHTML("beforeend", ARROW);
  e.append(s, b);
  e.addEventListener("pointerdown", ()=>Sound.play("tap"));
  return e;
}

  };
  render();
  redraw.onclick = ()=>{ status.textContent = ""; render(true); };
  const holdHint = "Press and hold the postcard to copy or save it instead.";
  copy.onclick = ()=>{
    if(!current) return;
    try{
      if(!navigator.clipboard || !window.ClipboardItem) throw 0;
      navigator.clipboard.write([new ClipboardItem({"image/png": current})])
        .then(()=>{ status.textContent = "Copied. Paste it into the group chat."; }, ()=>{ status.textContent = "This app won't let me copy it. " + holdHint; });
    }catch(e){ status.textContent = "This app won't let me copy it. " + holdHint; }
  };
  save.onclick = async ()=>{
    if(!current) return;
    try{
      const slug = party.names.join("-").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "guest";
      const filename = `cape-of-no-hope-${slug}.png`;
      const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
      if(dl){ await dl.save({filename, data: current}); status.textContent = "Saved. Share it in the group."; return; }
      const a = document.createElement("a"); a.href = URL.createObjectURL(current); a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      status.textContent = "Saved to your downloads. Share it in the group.";
    }catch(e){
      if(e && e.code === "declined") status.textContent = "";
      else status.textContent = "Saving isn't available here. " + holdHint;
    }
  };
  return wrap;
}

const imgCache = {};
function loadImg(src){
  if(!imgCache[src]) imgCache[src] = new Promise((res, rej)=>{ const im = new Image(); im.onload = ()=>res(im); im.onerror = rej; im.src = src; });
  return imgCache[src];
}
function wrapLines(g, text, maxW){
  const words = text.split(" "), lines = []; let line = "";
  for(const w of words){ const test = line ? line + " " + w : w; if(g.measureText(test).width > maxW && line){ lines.push(line); line = w; } else line = test; }
  if(line) lines.push(line);
  return lines;
}
function fitFont(g, text, family, weight, size, maxW){
  let s = size; g.font = `${weight} ${s}px ${family}`;
  while(g.measureText(text).width > maxW && s > 18){ s -= 2; g.font = `${weight} ${s}px ${family}`; }
  return s;
}

async function makePostcard(choice){
  await Promise.all([document.fonts.load('500 44px "Caveat"'), document.fonts.load('400 44px "Pirata One"')]).catch(()=>{});
  const [stamp, logo] = await Promise.all([loadImg(pick(STAMPS)), loadImg(LOGO_POST_PNG)]);
  const W = 1600, H = 1000;
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const g = c.getContext("2d");
  const INK = "#1d1830", RED = "#9c0a12", DELFT = "#18357f", HAND = '"Caveat", "Segoe Print", cursive', PIRATA = '"Pirata One", "Sinistre", serif';

  // aged card stock
  g.fillStyle = "#e1e2dd"; g.fillRect(0, 0, W, H);
  for(let i = 0; i < 9; i++){
    const x = Math.random() * W, y = Math.random() * H, r = 120 + Math.random() * 260;
    const st = g.createRadialGradient(x, y, 0, x, y, r);
    st.addColorStop(0, "rgba(120,122,110,.07)"); st.addColorStop(1, "rgba(120,122,110,0)");
    g.fillStyle = st; g.fillRect(0, 0, W, H);
  }
  for(let i = 0; i < 9000; i++){ g.fillStyle = `rgba(50,52,48,${Math.random() * .06})`; g.fillRect(Math.random() * W, Math.random() * H, 1.6, 1.6); }
  const vig = g.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, W * .72);
  vig.addColorStop(0, "rgba(70,72,66,0)"); vig.addColorStop(1, "rgba(70,72,66,.16)");
  g.fillStyle = vig; g.fillRect(0, 0, W, H);
  g.strokeStyle = RED; g.lineWidth = 3; g.strokeRect(28, 28, W - 56, H - 56);
  g.lineWidth = 1.5; g.strokeRect(40, 40, W - 80, H - 80);

  // stamp, top right
  const sc = Math.min(Math.sqrt(96000 / (stamp.width * stamp.height)), 400 / stamp.width, 380 / stamp.height);   // similar weight whatever the shape
  const sw = stamp.width * sc, sh = stamp.height * sc;
  const sx = W - 84 - sw, sy = 78;
  g.save();
  g.translate(sx + sw / 2, sy + sh / 2); g.rotate((Math.random() * 6 - 3) * Math.PI / 180);
  g.drawImage(stamp, -sw / 2, -sh / 2, sw, sh);
  g.restore();

  // logo, top left
  const LX = 92, lh = 330 * logo.height / logo.width;
  g.drawImage(logo, LX - 6, 74, 330, lh);

  // handwriting: each line sits a touch off-level, like a real pen
  const hand = (text, x, y, size, color, font = `500 ${size}px ${HAND}`)=>{
    g.save(); g.translate(x, y); g.rotate((Math.random() - .5) * .012);
    g.font = font; g.fillStyle = color; g.fillText(text, 0, 0); g.restore();
  };
  const pirata = (text, x, y, size)=>hand(text, x, y, size, DELFT, `400 ${size}px ${PIRATA}`);
  g.textBaseline = "alphabetic"; g.textAlign = "left";
  pirata(choice === "IN" ? "On the road, 31st October" : "From afar, 31st October", LX, 78 + lh + 66, 42);

  // signature block anchored to the bottom
  const sigW = 1000;
  const sigSizes = party.names.map((_, i)=>fitFont(g, titled(i), PIRATA, 400, 58, sigW));
  const sigH = 70 + sigSizes.reduce((s, z)=>s + Math.round(z * 1.25), 0);
  const sigTop = H - 92 - sigH;

  // the note fills the space between the logo and the signature, beside the stamp
  const note = pick(choice === "IN" ? ARRIVALS : REGRETS);
  const noteTop = 78 + lh + 150, LW = sx - 60 - LX;
  const avail = sigTop - noteTop - 10;
  let size = 78, lines, lineH;
  for(; size >= 30; size -= 2){
    g.font = `500 ${size}px ${HAND}`; lines = wrapLines(g, note, LW); lineH = Math.round(size * 1.3);
    if(lines.length * lineH <= avail) break;
  }
  let y = noteTop + 6;
  lines.forEach(l=>{ hand(l, LX, y, size, INK); y += lineH; });

  y = sigTop + 40;
  hand(choice === "IN" ? "Yours in dread," : "Yours, from the shadows,", LX, y, 44, INK);
  y += 10;
  party.names.forEach((_, i)=>{ const z = sigSizes[i]; y += Math.round(z * 1.25); pirata(titled(i), LX + 24, y, z); });

  return await new Promise((res, rej)=>c.toBlob(b=> b ? res(b) : rej(new Error("no blob")), "image/png"));
}

/* ---------- the dithered skull behind the conversation ----------
   30 frames of the clawed hand turning the skull, taken from the end of the
   intro film. Each frame is dithered live (Atkinson, with a little noise so the
   dots boil) and drawn in a darker red, then scaled up with hard pixel edges. */
let skullStarted = false;
function startSkull(){
  if(skullStarted) return; skullStarted = true;
  const cv = $("skulls"), fr = $("frame");
  const img = new Image();
  img.onload = ()=>{
    const FW = 108, FH = 192, COLS = 6, COUNT = 30;
    const off = document.createElement("canvas"); off.width = img.width; off.height = img.height;
    const og = off.getContext("2d"); og.drawImage(img, 0, 0);
    const all = og.getImageData(0, 0, img.width, img.height).data;
    const frames = [];
    for(let f = 0; f < COUNT; f++){
      const ox = (f % COLS) * FW, oy = Math.floor(f / COLS) * FH, d = new Float32Array(FW * FH);
      for(let y = 0; y < FH; y++) for(let x = 0; x < FW; x++){
        const v = all[((oy + y) * img.width + ox + x) * 4] / 255;
        const k = Math.max(0, Math.min(1, (.95 - v) * 1.25));
        d[y * FW + x] = Math.min(.8, Math.pow(k, .85));          // darkness, capped so shadows stay dotted
      }
      frames.push(d);
    }
    const small = document.createElement("canvas"); small.width = FW; small.height = FH;
    const sg = small.getContext("2d"); const id = sg.createImageData(FW, FH), px = id.data;
    const work = new Float32Array(FW * FH);
    const g = cv.getContext("2d");
    function size(){
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      cv.width = Math.round(fr.clientWidth * dpr); cv.height = Math.round(fr.clientHeight * dpr);
    }
    size(); window.addEventListener("resize", size);
    function draw(fi){
      const src = frames[fi];
      for(let i = 0; i < work.length; i++) work[i] = src[i] + (Math.random() - .5) * .07;
      for(let y = 0; y < FH; y++) for(let x = 0; x < FW; x++){
        const i = y * FW + x, old = work[i], on = old > .5, err = (old - (on ? 1 : 0)) / 8, o = i * 4;
        px[o] = 128; px[o + 1] = 5; px[o + 2] = 11; px[o + 3] = on ? 255 : 0;
        if(x + 1 < FW) work[i + 1] += err;
        if(x + 2 < FW) work[i + 2] += err;
        if(y + 1 < FH){ if(x > 0) work[i + FW - 1] += err; work[i + FW] += err; if(x + 1 < FW) work[i + FW + 1] += err; }
        if(y + 2 < FH) work[i + 2 * FW] += err;
      }
      sg.putImageData(id, 0, 0);
      // cover the screen, hand rising from the bottom edge
      const s = Math.max(cv.width / FW, cv.height / FH);
      const dw = FW * s, dh = FH * s;
      g.clearRect(0, 0, cv.width, cv.height);
      g.imageSmoothingEnabled = false;
      g.drawImage(small, (cv.width - dw) / 2, cv.height - dh, dw, dh);
    }
    cv.style.display = "block";
    requestAnimationFrame(()=>cv.classList.add("on"));
    if(REDUCED){ draw(12); return; }
    let fi = 0, dir = 1, last = 0;
    (function tick(now){
      if(now - last > 125){                 // 8 frames a second, turning back and forth
        last = now; draw(fi);
        fi += dir; if(fi >= COUNT - 1 || fi <= 0) dir = -dir;
      }
      requestAnimationFrame(tick);
    })(0);
  };
  img.src = SKULL_SRC;
}
</script>
